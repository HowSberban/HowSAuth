# HowSAuth 配置文件

# 配置文件版本（完整版本号），请勿修改
version: ${version}

# 数据库设置
database:
  # 数据库类型：sqlite 或 mysql
  type: sqlite
  # MySQL 配置（仅 type=mysql 时生效）
  mysql:
    host: localhost
    # 端口（有效范围 1-65535）
    port: 3306
    database: hsauth
    username: root
    password: ""
    # 连接池大小（有效范围 1-128）
    pool-size: 10
    # 连接参数（键值对，拼接到 JDBC URL）
    # 数据库在远程主机上时建议开启加密以提高安全性
    params:
      useSSL: "false"
      useUnicode: "true"
      characterEncoding: "UTF-8"

# 登录设置
login:
  # 登录超时时间（秒），0 = 不限制
  timeout: 120
  # 超时未登录是否踢出玩家
  kick-on-timeout: true
  # 登录失败保护
  fail-protection:
    enabled: true
    # 连续登录失败次数上限，超过后踢出
    max-attempts: 3
    # 踢出时长（秒），期间无法再次进服
    kick-duration: 60
    # 失败计数过期时间（秒）：超过此时长未再失败则清零，最小 1
    # 计数跨连接累计以防重连绕过上限，设过期时间则避免长期不清误伤正常玩家
    reset-seconds: 300
  # 提示消息重复发送间隔（秒），0 = 仅发送一次
  remind-interval: 5
  # 提示消息发送方式：chat（聊天栏）/ title（标题）/ actionbar（动作栏）/ bossbar（Boss 栏）
  remind-method: chat
  # 登录窗口（1.21.11+）：进入世界前弹出图形化窗口完成登录/注册/2fa
  # 登录前客户端不接收任何世界信息，无需坐标保护
  dialog:
    enabled: true
    # 在 1.21.6–1.21.10 冒险启用登录窗口：该版本段存在未验证的兼容问题，默认关闭
    # 启用需自担风险，服务端与客户端版本均须不低于 1.21.6
    # 该开关在启动时决定登录窗口组件是否加载，修改后需重启生效
    allow-risky-versions: false
  # IP 变动提醒：登录 IP 与上次不同时提示玩家
  ip-change-notify: false
  # 会话保持：上次登录 IP 与当前一致且未过期时免输密码
  session:
    enabled: true
    # 失效时间（分钟），从上次登录起算，超过后需重新输入密码
    # 至少为 1，会话不应永久有效
    expire-minutes: 120
  # 双因素认证（TOTP）
  2fa:
    # 是否启用双因素认证
    # 关闭后已绑定玩家跳过验证直接登录，密钥不删，重新开启即恢复
    enabled: true
    # 绑定时生成的临时密钥有效期（秒），超时后作废需重新 setup
    # 0 = 永不过期
    expire-seconds: 300
    # 2fa 会话保持：验证码通过后短时间内同 IP 重连免验证码，适合崩溃重连场景
    session:
      enabled: false
      # 会话有效期（分钟），从最后一次验证码通过起算，命中不续期，至少为 1
      # 窗口内同 IP 重连不需要验证码，时长越长风险越高
      expire-minutes: 5
    # 是否提供扫码网页入口
    # 开启后绑定页面会带一个网页二维码按钮，密钥会发给二维码服务，介意可关闭
    qr: true
    # 生成二维码的服务地址模板，{data} 会被替换为 URL 编码后的 otpauth 资料
    # 该地址会发给玩家在浏览器打开以扫码绑定，可换成其它支持该参数的服务
    qr-url: "https://api.qrserver.com/v1/create-qr-code/?data={data}&size=200x200&ecc=M&margin=10"
    # 验证器账户标签的服务器名（otpauth issuer）
    # 填写后条目显示为 "服务器名:玩家名"，玩家名作账户详情；留空则仅显示玩家名，不影响绑定
    server-name: ""

# 注册设置
register:
  # 注册超时时间（秒），0 = 不限制
  timeout: 180
  # 同一 IP 账号数量限制
  max-accounts-per-ip:
    # 同一 IP 最大账号数量，0 = 不限制
    limit: 3
    # 同 IP 已达上限时，是否在连接阶段直接拒绝未注册新玩家进服
    # true = 严格（进服即被拒）；false = 放行进服，由注册动作精确认定（适合共享 IP 环境）
    reject-join: true

# 密码规则
password:
  # 密码最小长度（不得小于 4）
  min-length: 6
  # 密码最大长度（不得大于 128，且不得小于最小长度）
  max-length: 32
  # 密码哈希算法
  # bcrypt：更强，但更慢
  # sha256：更快，但更易被破解
  hash: bcrypt
  # BCrypt work factor
  # 数值范围 10-31，越大越安全但越慢
  # 12 是一个很好的平衡
  hash-cost: 12
  # 密码字符规则：正则表达式，留空表示不限制
  pattern: '^[a-zA-Z0-9!@#$%^&*()\-_=+\[\]{}|;:,.<>?]+$'

# 登录前保护
protection:
  # 坐标保护（未登录时在主世界出生点周围随机位置等待，登录后传送回上次退出位置）
  # 与 CatSeedLogin 不同，开启此保护不会导致玩家位置丢失
  pos:
    enabled: false
    # 坐标模式：random（随机）或 fixed（固定坐标）
    mode: random
    # random：在世界出生点周围的随机半径（方块数），每次加入位置不同，避免玩家堆积
    spawn-radius: 10
    # fixed: 使用此坐标
    fixed:
      x: 0
      y: 64
      z: 0
      yaw: 0
      pitch: 0
  # 未登录旁观模式：未登录期间切换为旁观，登录后恢复上次的游戏模式
  # 首次注册的玩家恢复为服务器默认模式（server.properties 的 level-default-gamemode）
  # 若坐标保护关闭且上次退出位置悬空，该玩家强制旁观，避免落地摔落伤害
  gamemode: false
  # 登录前失明：未登录（含等待登录/注册/2FA）期间施加失明效果，登录/注册成功后自动移除
  blindness: true
  # 无凭据账号拦截：有账号但未设密码、未绑验证器且非正版的玩家，任何认证路径都不可行
  # true = 连接阶段直接拒绝进入（默认）；false = 放行进服挂起（仍无法完成登录，超时会被踢出）
  reject-no-auth-account: true
  # 背包保护：未登录玩家无法查看背包
  # 通过 PacketEvents 拦截物品数据包，防止恶意玩家窥视背包内容
  inventory: false
  # 行为限制（登录前禁止的行为）
  prevent:
    # 禁止移动
    move: true
    # 禁止转动视角（仅当 move 启用时生效）
    look: true
    # 禁止聊天
    chat: true
    # 禁止执行非白名单命令
    command:
      enabled: true
      whitelist:
        - login
        - l
        - register
        - reg
        - 2fa
        - totp
    # 禁止与世界交互
    world-interaction: true
    # 禁止背包交互
    inventory: true

# 末影珍珠恢复
# 玩家退出时移除飞行中的珍珠并记录，下次成功登录时返还
pearl:
  enabled: false
  # 登录后返还方式
  # item: 作为物品进入背包
  # entity: 在退出时的位置重新生成飞行珍珠
  return: entity

# 加入/退出消息
messages:
  join:
    # 设为 true 时完全禁用所有玩家的加入消息（无论登录状态，忽略下方其余选项）
    disabled: false
    # 未登录（未完成登录/注册）时隐藏原版加入消息（已登录玩家不受影响）
    hide-unauthenticated: true
    # 隐藏后是否在登录成功时补发：模板为空补发原版消息，否则补发模板内容
    # 仅在 hide-unauthenticated 开启时生效；玩家未登录就退出则丢弃不补发
    # 补发不走加入事件：若服务器装有强制隐藏所有加入消息的插件，请关闭本项
    delay-until-authenticated: true
    # 自定义加入消息模板，留空保留原版消息
    # 支持 & 颜色代码与占位符 {player}（玩家名）、{displayname}（显示名）
    template: ""
  quit:
    # 设为 true 时完全禁用所有玩家的退出消息（无论登录状态，忽略下方其余选项）
    disabled: false
    # 未登录时隐藏原版退出消息（登录超时被踢等场景不暴露"有人卡在登录界面"；已登录玩家不受影响）
    hide-unauthenticated: true
    # 自定义退出消息模板，留空保留原版消息，占位符同加入模板
    template: ""

# 通用设置
settings:
  # 默认语言
  # 可在插件 lang/ 目录添加 <语言>.properties 支持更多语言
  default-language: zh_CN
  # 是否根据客户端语言自动匹配消息（关闭则所有玩家使用默认语言）
  i18n: true
  # 注销账号时是否删除 Minecraft 原版玩家数据（player.dat）
  # 包含背包、装备、血量、经验、位置、末影箱等
  real-unreg: true
  # 是否允许玩家自助注销账号（/unregister）
  # 须验证密码与 2FA 验证码（按账户持有情况），并二次确认；正版账户免验证
  # 管理员删除账号不受此开关影响（/hsauth unreg）
  allow-self-unregister: true
  # 清理不活跃账号：启动时删除超过 days 天未登录的账号（正版账号不受影响）
  purge:
    enabled: false
    days: 90

# 正版验证
# 可以让正版玩家换名也不会丢失数据
premium:
  # 正版验证开关：控制新玩家是否尝试正版验证；已登记为正版的账号仍始终进行正版验证
  enabled: false
  # 新玩家进服时是否自动尝试正版验证
  # true：新玩家自动验证，通过即以正版身份进入
  # false：一律按离线身份进入，需手动 /upgrade 升级
  auto-verify: true
  # 无法直连 Mojang 时使用的 HTTP 代理，多行输入
  # 请求仍发往官方地址，仅借道代理转发
  http-proxies:
    - 'example.com:25565'
  # hasJoined 接口的镜像服务器，不要使用不可信的第三方镜像！
  session-server-mirrors:
    - 'https://mirror.example.com'
  # 单次 hasJoined 请求超时（秒），正常响应在 1 秒内，此值仅兜底挂起请求
  timeout-seconds: 5
  # 一次完整验证（含端点切换与重试）的总时限（毫秒）
  # 客户端约 30 秒无响应即断开，不要超过 30000
  verify-deadline-ms: 30000
  # 离线客户端标记缓存时长（秒），检测到离线客户端后记下其 IP+名
  # 期间重连直接按离线处理，不必重复验证
  cracker-cache-seconds: 120
  # 加密握手阶段等待 EncryptionResponse 的超时（毫秒），防止会话被挂机客户端滞留
  handshake-timeout-ms: 30000
  # 429/5xx（过载）的重试次数，不含首次请求，204（未加入）为确定结论，不重试
  max-retries: 2
  # 重试间隔（毫秒）
  retry-interval-ms: 500
  # 正版验证异步任务线程池大小（2-64），请求为阻塞式任务，高并发验证可调大
  # 线程池在启动时构建，修改后需重启生效
  http-pool-size: 2
  # 离线确认 / 回退缓存上限，防止条目过多占用内存
  cache-cap: 1000
  # 离线账号升级为正版：是否允许玩家从离线升级为正版
  upgrade: true
  # 正版账号降级为离线：是否允许玩家从正版降级为离线
  downgrade: false
  # 正版验证失败时的回退登录（仅对已注册正版玩家生效），不安全，不建议开启
  # 放行玩家并以已记录的正版 UUID 进入，走密码登录
  # 开启后风险：
  # 1. 攻击者可在网络层伪造验证失败（拦截/污染 HTTPS、利用镜像端点故障），诱导正常玩家落入密码路径
  # 2. 此场景下密码成为该账号唯一防线，弱密码账号可被直接撞库
  # 3. 验证失败后 cache-seconds 内该 IP+名重连全部跳过正版验证，攻击者可复用首次失败窗口反复尝试
  fallback:
    enabled: false
    # 回退标记有效期（秒），期间该 IP+名重连直接走回退路径，跳过加密握手
    # 过期后重新尝试正版验证
    cache-seconds: 300

# 高级设置
# 仅供高级用户使用：改动前请确认理解每一项的作用
advanced:
  # 调试模式：记录认证流程的详细日志（命令与服务层操作、加入/退出决策、会话命中、正版验证、数据落库等）
  # 面向排查，日志单独写 plugins/HowSAuth/debug.log（不进控制台与 latest.log），为英文硬编码且不含密码/密钥等敏感值
  # 轮转时机：每次开服、以及跨日（当天首次写入前）各归档一份，单个文件不超过一天
  # 归档名为 debug-<最后写入时间>.log，不限制单个文件大小
  # 关闭时不产生该文件、也不触碰已有文件（上次开启留下的 debug.log 保持原样）；修改后可用 /hsauth reload 生效
  debug: false