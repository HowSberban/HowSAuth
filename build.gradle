plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'org.howtologin'
version = '0.1.0'

def buildNumber = project.findProperty('buildNumber')

tasks.named('jar') {
    archiveFileName = buildNumber
        ? "HowToLogin-${version}-build.${buildNumber}.jar"
        : "HowToLogin-${version}.jar"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi-repo"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "codemc-releases"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "codemc-snapshots"
        url = "https://repo.codemc.io/repository/maven-snapshots/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("org.xerial:sqlite-jdbc:3.46.1.3")
    compileOnly("com.mysql:mysql-connector-j:8.4.0")
    compileOnly("com.zaxxer:HikariCP:5.1.0")
    compileOnly("org.mindrot:jbcrypt:0.4")
    compileOnly("me.clip:placeholderapi:2.11.6")
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    // authlib 运行时由 Paper 服务端提供，编译期需要用于 GameProfile/Property（PlayerInjector 设置 authenticatedProfile）
    compileOnly("com.mojang:authlib:9.0.75")

    // ===== 测试（长期稳定性压测：MockBukkit 模拟 Bukkit 运行时，真实 SQLite/加密/连接池） =====
    // main 的 compileOnly 不进入测试编译路径，测试需显式声明的 Bukkit API
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.100.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    // 生产代码 compileOnly 的依赖在测试运行期需要真实实现（插件主类类加载链会解析到它们）
    testRuntimeOnly("org.xerial:sqlite-jdbc:3.46.1.3")
    testRuntimeOnly("org.mindrot:jbcrypt:0.4")
    testRuntimeOnly("com.zaxxer:HikariCP:5.1.0")
    testRuntimeOnly("org.slf4j:slf4j-nop:2.0.13")
    testRuntimeOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    testRuntimeOnly("com.mojang:authlib:9.0.75")
    testRuntimeOnly("me.clip:placeholderapi:2.11.6")
}

tasks.named('test') {
    useJUnitPlatform()
    // MockBukkit 与 1.21.11 的 paper-api 钩子（Brigadier/lifecycle）在测试中不需要，无需转发
    testLogging {
        events "passed", "skipped", "failed"
    }
}

configurations.configureEach {
    resolutionStrategy.force(
            'org.codehaus.plexus:plexus-utils:3.6.1',
            'org.apache.commons:commons-lang3:3.18.0',
            'com.google.protobuf:protobuf-java:3.25.5',
            'io.netty:netty-all:4.1.136.Final',
            'io.netty:netty-codec:4.1.136.Final',
            'io.netty:netty-codec-haproxy:4.1.136.Final',
            'io.netty:netty-codec-http:4.1.136.Final',
            'io.netty:netty-codec-http2:4.1.136.Final',
            'io.netty:netty-codec-smtp:4.1.136.Final',
            'io.netty:netty-common:4.1.136.Final',
            'io.netty:netty-handler:4.1.136.Final'
    )
}

tasks {
    runServer {
        // 配置 Minecraft 版本，必须使用完整版本号
        // 插件的 jar（或 shadowJar）会自动被加载
        minecraftVersion("1.21.11")
    }
}

// 注册 Folia 调试任务：gradle runFolia
runPaper {
    folia.registerTask()
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // 始终使用工具链，避免使用仅有 JRE 的环境无法编译
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def fullVersion = version
    inputs.properties([version: fullVersion])
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand version: fullVersion
    }
    // config.yml 含正则表达式，expand 会将其作为 Groovy 模板解析导致语法错误
    // 改用 filter 逐行替换，只处理 ${version} 占位符
    filesMatching('config.yml') {
        filter { line -> line.replace('${version}', fullVersion) }
    }
}
