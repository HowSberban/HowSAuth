name: Test
run-name: ${{ inputs.display_name }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      display_name:
        description: '任务名称'
        type: string
        default: 'Test'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew --no-daemon test --stacktrace

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-report
        path: |
          build/reports/tests/test
          build/test-results/test
        if-no-files-found: ignore